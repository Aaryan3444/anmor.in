<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANMOR™️</title>
  <meta name="description" content="Power, designed in India. First: a charger. It has one light.">
  <meta property="og:title" content="ANMOR™️">
  <meta property="og:description" content="Power, designed in India. First: a charger. It has one light.">
  <link rel="canonical" href="https://anmor.in/">
  <meta name="theme-color" content="#0B0C0E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%230B0C0E'/%3E%3Cpath%20d='M11%2052%2032%2010%2053%2052'%20fill='none'%20stroke='%23EDEDEA'%20stroke-width='5'%20stroke-linejoin='bevel'/%3E%3Cpath%20d='M23%2036h18'%20stroke='%23FFFFFF'%20stroke-width='8'%20stroke-linecap='round'%20opacity='.23'/%3E%3Cpath%20d='M23%2036h18'%20stroke='%23FFFFFF'%20stroke-width='3'%20stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: Outfit;
      src: url("https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJtEtq.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --graphite: #0B0C0E;
      --matte: #EDEDEA;
      --silver: #A9AEB5;
      --glow: #FFFFFF;
      --full: #34D27B;
      --rule: #A9AEB538;
      --clear: transparent;
      --sans: Outfit, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
      --gutter: clamp(1.5rem, 5vw, 4.5rem);
      --ease: cubic-bezier(.22, .65, .3, 1);
      --grain: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='144'%20height='144'%3E%3Cfilter%20id='grain'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%20color-interpolation-filters='sRGB'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='.88'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='144'%20height='144'%20opacity='.08'%20filter='url(%23grain)'/%3E%3C/svg%3E");
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--graphite) var(--grain) repeat;
      color: var(--matte);
      font: 400 1rem/1.5 var(--sans);
    }

    h1, h2, p {
      margin: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .charge {
      position: fixed;
      z-index: 2;
      inset: 0 0 auto;
      pointer-events: none;
    }

    .charge-track {
      height: 2px;
      background: var(--rule);
    }

    .charge-fill {
      height: 100%;
      background: var(--silver);
      transform: scaleX(0);
      transform-origin: left center;
    }

    .charge-label, .section-label {
      color: var(--silver);
      font: 400 .6875rem/1.35 var(--mono);
      letter-spacing: .12em;
    }

    .charge-label {
      display: block;
      margin: .75rem var(--gutter) 0;
      text-align: right;
    }

    .is-full .charge-fill {
      background: var(--full);
    }

    .is-full .charge-label {
      color: var(--full);
    }

    .hero {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 4rem var(--gutter);
      text-align: center;
    }

    .hero-inner {
      display: grid;
      justify-items: center;
      gap: clamp(1.35rem, 4.5vw, 2.75rem);
    }

    .power-rule {
      width: clamp(4rem, 26vw, 12rem);
      height: 1px;
      background: var(--silver);
      opacity: .34;
      transform-origin: left center;
    }

    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: .14em;
      color: var(--matte);
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .hero-wordmark {
      font-size: clamp(1rem, 14.5vw, 9.5rem);
    }

    .letters {
      margin-inline-end: -.14em;
      letter-spacing: .14em;
    }

    .tm {
      align-self: flex-start;
      margin: .28em 0 0 -.24em;
      font-size: .23em;
      line-height: 1;
    }

    .a-mark {
      width: .71em;
      height: .71em;
      overflow: visible;
      fill: none;
    }

    .a-strokes {
      stroke: currentColor;
      stroke-width: 11.5;
      stroke-linejoin: bevel;
    }

    .led {
      stroke: var(--led-color, var(--glow));
      stroke-linecap: round;
    }

    .led-core {
      stroke-width: 5;
    }

    .led-halo {
      stroke-width: 10;
      filter: url(#led-bloom);
      opacity: .32;
    }

    .hero-wordmark .led-halo {
      opacity: calc(.57 + var(--near, 0));
    }

    .hero-tagline {
      color: var(--silver);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      letter-spacing: .025em;
    }

    .rail {
      width: min(54rem, calc(100% - 2 * var(--gutter)));
      margin-inline: auto;
    }

    .step, .product, .footer {
      display: grid;
      align-content: center;
      padding-block: 4rem;
      border-top: 1px solid var(--rule);
    }

    .step {
      min-height: 80vh;
      min-height: 80svh;
    }

    .section-label {
      margin-bottom: 1.25rem;
    }

    .principle-copy {
      width: fit-content;
      max-width: 100%;
      font-size: clamp(1.25rem, 4.8vw, 3rem);
      line-height: 1.22;
    }

    .product {
      min-height: 88vh;
      min-height: 88svh;
    }

    .product-copy {
      font-size: clamp(1.85rem, 7.2vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.12;
    }

    .product-copy span {
      display: block;
      color: var(--silver);
    }

    .footer {
      min-height: 65vh;
      min-height: 65svh;
      justify-items: start;
      gap: 1.25rem;
    }

    .footer-wordmark {
      font-size: clamp(2rem, 8.6vw, 3.5rem);
    }

    .is-full .footer-wordmark .led {
      --led-color: var(--full);
    }

    .is-full .footer-wordmark .led-halo {
      opacity: 0;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1.5rem;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      color: var(--silver);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: .3em;
    }

    .socials a:hover, .socials a:focus-visible {
      color: var(--matte);
    }

    .socials a:focus-visible {
      outline: 2px solid var(--matte);
      outline-offset: .25rem;
    }

    .copyright {
      color: var(--silver);
      font: 400 .75rem/1.5 var(--mono);
    }

    @media (min-width: 48rem) {
      .footer {
        grid-template-columns: 1fr auto;
        align-items: center;
      }

      .copyright {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .power-rule {
        animation: draw-rule .5s var(--ease) both;
      }

      .hero-wordmark {
        animation: power-in .75s .32s var(--ease) both;
      }

      .hero-tagline {
        animation: power-in .65s .55s var(--ease) both;
      }

      .hero-wordmark .led {
        animation: ignite .44s 1.06s var(--ease) both,
                   breathe 4s 1.5s ease-in-out infinite;
      }

      .hero-wordmark .led-halo {
        transition: opacity .16s ease-out;
      }

      .reveal-ready .principle-copy {
        opacity: 0;
      }

      .reveal-ready .principle-copy.is-revealed {
        animation: sweep 1.15s var(--ease) both;
      }

      @supports (background-clip: text) {
        .reveal-ready .principle-copy.is-revealed {
          background-image: linear-gradient(102deg,
            var(--matte) 34%, var(--silver) 43%, var(--glow) 50%, var(--matte) 63%);
          background-size: 300% 100%;
          background-clip: text;
          color: var(--clear);
        }
      }
    }

    @media (forced-colors: active) {
      .reveal-ready .principle-copy.is-revealed {
        --system-text: CanvasText;
        background: none;
        color: var(--system-text);
      }
    }

    @keyframes draw-rule {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes power-in {
      from { opacity: 0; transform: translateY(.3rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ignite {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .64; }
    }

    @keyframes sweep {
      from { opacity: 0; transform: translateY(.4rem); background-position: 100% 0; }
      45% { opacity: 1; }
      to { opacity: 1; transform: translateY(0); background-position: 0 0; }
    }
  </style>
</head>
<body>
  <div class="charge">
    <div class="charge-track" aria-hidden="true">
      <div class="charge-fill" id="charge-fill"></div>
    </div>
    <span class="charge-label" id="charge-label" role="status">CHARGING</span>
  </div>

  <main>
    <section class="hero" aria-labelledby="hero-heading">
      <div class="hero-inner">
        <div class="power-rule" aria-hidden="true"></div>
        <h1 id="hero-heading">
          <span class="sr-only">ANMOR™</span>
          <span class="wordmark hero-wordmark" aria-hidden="true">
            <!-- Swap in the final A artwork here and in the footer and favicon.
                 Keep the LED as a separate element in both wordmarks. -->
            <svg class="a-mark" id="hero-a" viewBox="0 0 78 80" focusable="false">
              <defs>
                <filter id="led-bloom" filterUnits="userSpaceOnUse"
                        x="7" y="28" width="64" height="42" color-interpolation-filters="sRGB">
                  <feGaussianBlur stdDeviation="3.8"/>
                </filter>
              </defs>
              <g class="led">
                <path class="led-halo" d="M25 49h28"/>
                <path class="led-core" d="M25 49h28"/>
              </g>
              <path class="a-strokes" d="M6 78 39 3.5 72 78"/>
            </svg>
            <span class="letters">NMOR</span><sup class="tm">™</sup>
          </span>
        </h1>
        <p class="hero-tagline">Power, designed in India.</p>
      </div>
    </section>

    <section class="rail" aria-labelledby="principles-heading">
      <div class="step">
        <h2 class="section-label" id="principles-heading">01 / PRINCIPLES</h2>
        <p class="principle-copy">Designed, not defaulted.</p>
      </div>
      <div class="step">
        <p class="principle-copy">Every part earns its place.</p>
      </div>
      <div class="step">
        <p class="principle-copy">Built by factories we choose.</p>
      </div>
    </section>

    <section class="product rail" aria-labelledby="product-heading">
      <h2 class="product-copy" id="product-heading">First: a charger. <span>It has one light.</span></h2>
    </section>
  </main>

  <footer class="footer rail">
    <p>
      <span class="sr-only">ANMOR™</span>
      <span class="wordmark footer-wordmark" aria-hidden="true">
        <svg class="a-mark" viewBox="0 0 78 80" focusable="false">
          <g class="led">
            <path class="led-halo" d="M25 49h28"/>
            <path class="led-core" d="M25 49h28"/>
          </g>
          <path class="a-strokes" d="M6 78 39 3.5 72 78"/>
        </svg>
        <span class="letters">NMOR</span><sup class="tm">™</sup>
      </span>
    </p>
    <div class="socials">
      <a href="https://instagram.com/anmortech" aria-label="ANMOR on Instagram">Instagram</a>
      <a href="https://youtube.com/@anmorofficial" aria-label="ANMOR on YouTube">YouTube</a>
    </div>
    <small class="copyright">© 2026 ANMOR™</small>
  </footer>

  <script>
    (() => {
      const root = document.documentElement;
      const scroller = document.scrollingElement || root;
      const fill = document.getElementById("charge-fill");
      const label = document.getElementById("charge-label");
      const heroA = document.getElementById("hero-a");
      const proximity = matchMedia("(min-width: 48rem) and (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)");

      let frame = 0;
      let full = false;
      let pointer = null;

      function update() {
        frame = 0;
        const range = scroller.scrollHeight - scroller.clientHeight;
        const progress = range > 0
          ? Math.min(1, Math.max(0, scroller.scrollTop / range))
          : 0;
        const nextFull = progress >= .99;
        let boost = 0;

        if (pointer && proximity.matches) {
          const a = heroA.getBoundingClientRect();
          const distance = Math.hypot(pointer.x - a.left - a.width / 2,
                                      pointer.y - a.top - a.height / 2);
          const radius = Math.max(96, a.height * 2);
          boost = .23 * Math.max(0, 1 - distance / radius);
        }

        fill.style.transform = `scaleX(${nextFull ? 1 : progress})`;
        heroA.style.setProperty("--near", boost.toFixed(3));

        if (nextFull !== full) {
          full = nextFull;
          root.classList.toggle("is-full", full);
          label.textContent = full ? "FULL" : "CHARGING";
        }
      }

      function scheduleUpdate() {
        if (!frame) frame = requestAnimationFrame(update);
      }

      function clearPointer() {
        pointer = null;
        scheduleUpdate();
      }

      window.addEventListener("scroll", scheduleUpdate, { passive: true });
      window.addEventListener("resize", scheduleUpdate, { passive: true });
      window.addEventListener("pageshow", scheduleUpdate);
      window.addEventListener("pointermove", (event) => {
        if (!proximity.matches || event.pointerType !== "mouse") return;
        pointer = { x: event.clientX, y: event.clientY };
        scheduleUpdate();
      }, { passive: true });
      root.addEventListener("pointerleave", clearPointer, { passive: true });
      window.addEventListener("blur", clearPointer);
      proximity.addEventListener("change", clearPointer);

      if ("ResizeObserver" in window) {
        new ResizeObserver(scheduleUpdate).observe(document.body);
      }

      if ("IntersectionObserver" in window) {
        const reveal = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.classList.add("is-revealed");
            reveal.unobserve(entry.target);
          }
        }, { rootMargin: "0px 0px -48px 0px" });

        root.classList.add("reveal-ready");
        document.querySelectorAll(".principle-copy").forEach((copy) => reveal.observe(copy));
      }

      scheduleUpdate();
    })();
  </script>
</body>
</html>
